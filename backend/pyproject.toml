[project]
name = "cashguard"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
detector = [
    "torch==2.11.0",
    "transformers==5.20.1",
    "scipy==1.15.3",
]
